name: ci

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - name: Unit tests (abkit vs statsmodels / SciPy / published tables)
        run: pytest -q
      - name: Fetch public data
        run: python scripts/fetch_data.py
      - name: Execute notebooks end to end
        working-directory: notebooks
        run: |
          for nb in 0*.py; do
            jupytext --to ipynb --execute "$nb"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            reports/
            notebooks/*.ipynb
